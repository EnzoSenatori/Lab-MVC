<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lab-MVC | Livraria{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <header class="header">
        <div class="container header__content">
            <div class="brand">
                <a href="/" style="text-decoration:none;color:inherit;">
                    <span class="brand__logo">Lab-MVC</span>
                </a>
                <span class="brand__tagline">Busca, reserva e retirada de livros</span>
            </div>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
